[package]
name = "coverage-cockpit"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"

[lib]
name = "coverage_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
portable-pty = "0.8"
